<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Splash logo preload. The loader paints before any bundle arrives, so the
      brand lockup is fetched at the highest priority the document can give it.
      No `crossorigin` here on purpose: the <img> below is same-mode, and adding
      it would split the cache entry and fetch the file twice.
    -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://res.cloudinary.com/v8vrixwq/image/upload/f_auto,q_auto,w_520/v1788670626/logo.png"
    />

    <!--
      Favicons. Every file referenced here exists in public/ and every one of
      them was generated from the LAMIKAA mark
      (…/v1788670625/icon.png, 696x696 on a transparent ground) through
      Cloudinary resizes — see prompts/PROGRESS.md for the exact commands.
      favicon.ico carries a single 48x48 PNG payload.
    -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/apple-touch-icon.png"
    />

    <!--
      Browser chrome colour. Mirrors --lk-bg / --sf-color-bg: #0B0B0D is the
      LAMIKAA page ground. Static — there is one theme.
    -->
    <meta name="theme-color" content="#0B0B0D" />

    <!--
      Copy mirrors brand.seo in src/config/brand.js (and settings.seo in
      db.json).

      THERE IS NO STATIC og:url / twitter:url. brand.seo.siteUrl is still the
      LAMIKAA_DOMAIN placeholder — the owner has not named the public domain —
      and a literal token must never ship in a crawled tag, so Prompt 36 removed
      both rather than guessing a host. Nothing is lost: useSeo (src/hooks/useSeo.js)
      claims og:url and <link rel=canonical> on every route from seoOrigin(),
      which returns brand.seo.siteUrl the moment it stops being a placeholder
      and window.location.origin until then. Resolving the domain is a one-line
      edit in brand.js; re-adding a static tag here is optional and Prompt 38
      owns that call alongside the sitemap.
    -->
    <meta
      name="description"
      content="Farmer-owned skincare rooted in the indigenous wisdom of Assam and Northeast India. The Black Rice range: cleanse, refresh, treat and moisturise — beauty that creates value for farmers."
    />
    <meta
      name="keywords"
      content="black rice skincare, farmer-owned beauty, Assam skincare, LAMIKAA Naturals, face serum, face wash, moisturizer gel, Northeast India"
    />
    <meta name="author" content="LAMIKAA Naturals" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LAMIKAA NATURALS" />
    <meta property="og:locale" content="en_IN" />
    <meta
      property="og:title"
      content="LAMIKAA NATURALS — Black Rice Skincare, Farmer-Owned"
    />
    <meta
      property="og:description"
      content="Farmer-owned skincare rooted in the indigenous wisdom of Assam and Northeast India. The Black Rice range: cleanse, refresh, treat and moisturise — beauty that creates value for farmers."
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/v8vrixwq/image/upload/f_auto,q_auto,w_1200/v1788670626/logo.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="343" />
    <meta property="og:image:alt" content="LAMIKAA NATURALS" />

    <!--
      Twitter/X. The share image is the wordmark on a transparent ground, which
      the platforms composite onto their own card. `summary`, not
      `summary_large_image`: the large card crops to 2:1 and would slice a
      3.5:1 wordmark.
    -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="LAMIKAA NATURALS — Black Rice Skincare, Farmer-Owned"
    />
    <meta
      name="twitter:description"
      content="Farmer-owned skincare rooted in the indigenous wisdom of Assam and Northeast India. The Black Rice range: cleanse, refresh, treat and moisturise — beauty that creates value for farmers."
    />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/v8vrixwq/image/upload/f_auto,q_auto,w_1200/v1788670626/logo.png"
    />
    <meta name="twitter:image:alt" content="LAMIKAA NATURALS" />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Google Fonts — Fraunces (display) + Manrope (body/UI).

      THIS IS THE ONLY LOAD PATH for the two families, and it is deliberately
      ONE request: src/index.css does not @import them and no stylesheet
      declares an @font-face, because a second request for the same faces only
      delays first paint. Keep the weight lists in step with the weight tokens
      in src/theme/storefront-tokens.css (--sf-font-normal…-bold): Fraunces is
      requested at 400/500/600 across its full optical-size axis (opsz 9..144,
      driven by `font-optical-sizing: auto` on headings) and Manrope at
      400/500/600/700. `display=swap` is what keeps a slow font from blanking
      the page — the fallback stacks in the tokens paint first.

      The preconnects must stay: the CSS comes from fonts.googleapis.com and
      the woff2 files from fonts.gstatic.com (crossorigin, because fonts are
      always fetched in CORS mode), so both origins are warmed in parallel.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Cloudinary is where every product image lives, and the home hero's first
      slide is the LCP element on the page the site is judged on. Its URL cannot
      be preloaded — the hero is product-driven (one slide per `heroOrder`), so
      the URL is not known until the catalogue read comes back — which puts a
      cold DNS + TCP + TLS handshake on the critical path at the worst possible
      moment. Preconnecting warms that origin while the bundle is still
      downloading, so the image request starts on an open connection.

      No `crossorigin`: these are plain <img> loads in no-CORS mode, and a
      crossorigin preconnect would open a connection the images cannot reuse.
    -->
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!--
      The Material Icons stylesheet was here, on the claim that the admin's MUI
      icon set required it. It did not: `@mui/icons-material` ships its icons as
      React SVG components, and MUI's ligature-based <Icon> — the one component
      that needs the font — is used nowhere in this repository. The storefront's
      own icons are @iconify/react or hand-drawn inline SVG (Profile,
      OrderHistory and DeliveryReturnsInfo each define a local `Icon`).

      It cost every page a SECOND render-blocking stylesheet from
      fonts.googleapis.com, without `display=swap`, for an icon font nothing
      referenced. Prompt 22's Lighthouse pass found it; the audit's rule is one
      render-blocking font link, and that is the css2 link above.

      grep -rn "material-icons" src public → 0.
    -->

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Mirrors brand.seo.defaultTitle. Kept on one line: browsers collapse
         whitespace inside <title>, but naive SEO scrapers do not. -->
    <title>LAMIKAA NATURALS — Black Rice Skincare, Farmer-Owned</title>

    <!--
      Pre-mount shell styles: the loading screen and the body ground it
      fades into.

      TOKEN DISCIPLINE — this stylesheet is inlined into public/index.html and is
      parsed long before the app bundle (and therefore before
      src/theme/storefront-tokens.css) exists, so it CANNOT use var(--sf-*).
      Every literal below is the LAMIKAA dark palette and must be re-copied if
      the palette moves. There is ONE theme, so there is one set:

        #0B0B0D  --sf-color-bg              (page ground)
        #141416  --sf-color-surface
        #F7F5F0  --sf-color-text            (warm white)
        #B8B5B0  --sf-color-text-secondary
        #F5D76E  --sf-color-gold            (champagne gold)
        rgba(255, 255, 255, 0.08)           --sf-color-border (hairline)
        cubic-bezier(0.2, 0.7, 0.2, 1)      --sf-ease
        "Manrope", "Inter", …               --sf-font-family (splash body)
        "Fraunces", "Playfair Display", …   --sf-font-display (splash tagline)

      The two families come from the single Google Fonts <link> above, which
      the browser has already started fetching by the time this block is
      parsed; `display=swap` means the tagline paints in the fallback serif and
      re-renders in Fraunces, rather than holding the splash blank.
    -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Manrope", "Inter", -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* One theme, one ground, declared statically. Nothing reads a stored
           preference and nothing repaints this at mount, so no other colour
           can ever flash. Mirrors --sf-color-bg. */
        background: #0b0b0d;
        min-height: 100vh;
      }

      /* -----------------------------------------------------------------------
       * LOADING SCREEN
       * The mechanics are a contract with src/index.js and the scripts at the
       * bottom of this file: #loading-screen is the id that gets .fade-out, and
       * body.react-loaded is what hides it for good. Restyle freely; do not
       * rename either hook, and keep the fade transition <= the 600ms the hide
       * script waits before setting display:none.
       * -------------------------------------------------------------------- */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* Identical to the body ground above, so the fade-out reveals the page
           with no colour step. */
        background: #0b0b0d;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
        overflow: hidden;
      }

      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Hide loading screen when React app loads */
      body.react-loaded #loading-screen {
        display: none;
      }

      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 24px;
      }

      /* One wordmark, one theme — the transparent-ground artwork reads on the
         dark splash, so there is no second asset and no swap. */
      .loader-logo {
        display: block;
        width: clamp(190px, 46vw, 260px);
        height: auto;
        animation: loaderRise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.05s
          backwards;
      }

      .loader-tagline {
        margin: 28px 0 0;
        max-width: 24em;
        font-family: "Fraunces", "Playfair Display", Georgia, "Times New Roman",
          serif;
        font-size: 17px;
        font-weight: 500;
        line-height: 1.5;
        color: #b8b5b0;
        animation: loaderRise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s backwards;
      }

      /* A single gold hairline. Decorative only — it does not report real load
         progress, so it is hidden from assistive tech rather than dressed up as
         a progressbar. */
      .loader-rule {
        position: relative;
        width: clamp(160px, 38vw, 220px);
        height: 1px;
        margin-top: 44px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        animation: loaderRise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.35s
          backwards;
      }

      .loader-rule-sweep {
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        background: linear-gradient(
          90deg,
          rgba(245, 215, 110, 0) 0%,
          #f5d76e 50%,
          rgba(245, 215, 110, 0) 100%
        );
        animation: loaderSweep 2.4s cubic-bezier(0.2, 0.7, 0.2, 1) infinite;
      }

      @keyframes loaderRise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes loaderSweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }

      /* ---- No-JS notice ---------------------------------------------------- */
      .noscript-note {
        position: relative;
        z-index: 10000;
        margin: 0;
        padding: 20px 24px;
        text-align: center;
        font-size: 14px;
        line-height: 1.5;
        color: #f7f5f0;
        background: #141416;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* ---- Responsive ------------------------------------------------------ */
      @media (max-width: 480px) {
        .loader-tagline {
          margin-top: 22px;
          font-size: 15px;
        }

        .loader-rule {
          margin-top: 34px;
        }
      }

      /* ---- Reduced motion --------------------------------------------------
       * Static splash: everything already at its resting state, the hairline a
       * still gold rule, and no cross-fade on the way out. The hide script's
       * 600ms display:none timer is unaffected. */
      @media (prefers-reduced-motion: reduce) {
        #loading-screen {
          transition: none;
        }

        .loader-logo,
        .loader-tagline,
        .loader-rule {
          animation: none;
          opacity: 1;
          transform: none;
        }

        .loader-rule-sweep {
          animation: none;
          left: 0;
          width: 100%;
          background: #f5d76e;
          opacity: 0.5;
        }
      }
    </style>

    <noscript>
      <!--
        With JavaScript off React never mounts, so nothing ever adds
        body.react-loaded and the fixed loader would sit over the page forever,
        hiding the <noscript> message below it. Drop the loader in that case.
        Must come AFTER the stylesheet above: same specificity as the
        #loading-screen rule there, so source order is what decides.
      -->
      <style>
        #loading-screen {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <noscript>
      <p class="noscript-note">You need to enable JavaScript to run this app.</p>
    </noscript>

    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loader-container">
        <img
          class="loader-logo"
          src="https://res.cloudinary.com/v8vrixwq/image/upload/f_auto,q_auto,w_520/v1788670626/logo.png"
          alt="LAMIKAA NATURALS"
          width="1400"
          height="400"
        />
        <p class="loader-tagline">
          Indigenous Wisdom. Modern Beauty. Shared Prosperity.
        </p>
        <div class="loader-rule" aria-hidden="true">
          <span class="loader-rule-sweep"></span>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->

    <script>
      // LAMIKAA has ONE theme, so there is no pre-mount theme script: the body
      // ground is painted by the static rule in the <style> block above and
      // never repainted, and nothing here reads a stored preference.

      // Hide the loading screen once React has mounted. React signals readiness
      // by adding the "react-loaded" class to <body> (see src/index.js). We watch
      // for that class instead of using a fixed delay, so the loader never fades
      // out before content is ready (no flash of unstyled content). A fallback
      // timeout guarantees the loader can never get permanently stuck visible.
      (function () {
        var hidden = false;
        function hideLoadingScreen() {
          if (hidden) return;
          hidden = true;
          document.body.classList.add("react-loaded");
          var loadingScreen = document.getElementById("loading-screen");
          if (loadingScreen) {
            loadingScreen.classList.add("fade-out");
            setTimeout(function () {
              loadingScreen.style.display = "none";
            }, 600);
          }
        }

        if (document.body.classList.contains("react-loaded")) {
          hideLoadingScreen();
        } else if (typeof MutationObserver !== "undefined") {
          var observer = new MutationObserver(function () {
            if (document.body.classList.contains("react-loaded")) {
              hideLoadingScreen();
              observer.disconnect();
            }
          });
          observer.observe(document.body, {
            attributes: true,
            attributeFilter: ["class"],
          });
        }

        // Safety net: never let the loader hang if React is slow or fails.
        setTimeout(hideLoadingScreen, 10000);
      })();
    </script>
  </body>
</html>
